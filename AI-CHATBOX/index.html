<!DOCTYPE html>
<html>
    <head>
        <title>Test Chatbot - English</title>
        <link rel="stylesheet" href="./assets/css/style.css">
    </head>
    <body>
    <h2>🗣️ English Chat Widget (Test)</h2>
    
    <div id="chat-widget">
        
        <div id="chat-log">
            <div class="msg bot">Hello! What would you like to talk about?</div>
        </div>
        
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type or use mic..." />
            <button id="send-btn">➜</button>
            <button id="mic-btn" class="mic">|၊||။|</button>
        </div>
        
    </div>

    <script src="./assets/js/widget.js"></script>
</body>
</html>
